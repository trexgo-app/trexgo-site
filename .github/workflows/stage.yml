name: Выкладка на stage.trexgo.ru

# Любая ветка, кроме main (та выкладывается deploy.yml), плюс кнопка
# с произвольным ref — для сведения нескольких веток на одну интеграционную
# ветку и повторного показа без нового push.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка или коммит для выкладки на stage"
        type: string
        default: ""

# Одна ветка — один stage: вторая выкладка, начавшаяся раньше, чем закончилась
# первая, затопчет её же результат, поэтому ждём, не отменяем на полпути.
concurrency:
  group: stage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Тот же паттерн, что в deploy.yml: раннер не заливает файлы сам,
      # только просит сервер забрать код — разбор в ops/pull-deploy.sh.
      - name: Попросить сервер забрать код на stage
        env:
          SECRET: ${{ secrets.DEPLOY_SECRET }}
          TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          echo "длина токена: ${#TOKEN}"
          [ -n "$TOKEN" ] || { echo "::error::GITHUB_TOKEN пуст"; exit 1; }
          [ -n "$SECRET" ] || { echo "::error::DEPLOY_SECRET не задан в секретах репозитория"; exit 1; }
          body=$(jq -nc --arg ref "$REF" --arg token "$TOKEN" --arg env "stage" \
                        --argjson ts "$(date +%s)" \
                        '{ref: $ref, token: $token, env: $env, ts: $ts, dry_run: false}')
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -r | cut -d' ' -f1)
          code=$(curl -sS -X POST "https://trexgo.ru/deployhook.php" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Signature: $sig" \
            --data-binary "$body" \
            -o response.json -w '%{http_code}' --max-time 180)
          jq -r '.log // .message // "нет вывода"' response.json || cat response.json
          [ "$code" = "200" ] || { echo "::error::Сервер ответил HTTP $code"; exit 1; }
          echo "### Stage выложен" >> "$GITHUB_STEP_SUMMARY"
          echo "Ветка/коммит: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Адрес: https://stage.trexgo.ru/ (логин и пароль — в GitHub Secrets STAGE_AUTH_USER/STAGE_AUTH_PASSWORD)" >> "$GITHUB_STEP_SUMMARY"

      # always(): проверка обязана отработать и при упавшей выкладке — иначе
      # мы узнаём о сломанном stage только когда кто-то откроет ссылку сам.
      # Пароль передаём через -u из окружения, в лог не печатаем.
      - name: Проверить, что stage закрыт и жив
        if: always()
        env:
          AUTH_USER: ${{ secrets.STAGE_AUTH_USER }}
          AUTH_PASSWORD: ${{ secrets.STAGE_AUTH_PASSWORD }}
        run: |
          set -u
          fail=0
          # Доп. curl-флаги — позиционные аргументы начиная с 4-го, не строка:
          # раньше это был единственный параметр "$2", подставлявшийся в
          # команду без кавычек и полагавшийся на word-splitting. Пароль
          # с пробелом или glob-символом (?, *) молча ломал бы такую проверку.
          check() { # адрес, ожидаемый код, что это, [доп.curl-флаги...]
            url="$1"; want="$2"; label="$3"; shift 3
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$@" "$url" || echo 000)
            if [ "$code" != "$want" ]; then
              echo "::error::$label — ожидали HTTP $want, получили $code ($url)"
              fail=1
            else
              echo "ок: $label — HTTP $code"
            fi
          }
          check "https://stage.trexgo.ru/"        401 "без пароля закрыт"
          check "https://stage.trexgo.ru/"        200 "с паролем открыт"      -u "${AUTH_USER}:${AUTH_PASSWORD}"
          check "https://stage.trexgo.ru/ops/"    403 "CLI-скрипты закрыты и на stage" -u "${AUTH_USER}:${AUTH_PASSWORD}"
          robots=$(curl -sS -u "${AUTH_USER}:${AUTH_PASSWORD}" --max-time 20 "https://stage.trexgo.ru/robots.txt" || echo "")
          if printf '%s' "$robots" | grep -q '^Disallow: /$'; then
            echo "ок: robots.txt запрещает индексацию целиком"
          else
            echo "::error::robots.txt на stage не содержит 'Disallow: /'"
            fail=1
          fi
          # Заглушка формы — не просто «эндпоинт отвечает 200», а именно
          # stage-заглушка, а не настоящий api/leads.php: тело содержит
          # stored":"stage-stub" (см. ops/stage-overlay/api/leads.php).
          # Без этой проверки некорректно наложенный overlay (или ошибка
          # в порядке сборки в pull-deploy.sh) остался бы незамеченным —
          # первые четыре проверки его не видят.
          lead_body=$(curl -sS -u "${AUTH_USER}:${AUTH_PASSWORD}" --max-time 20 \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "https://stage.trexgo.ru/api/leads" || echo "")
          if printf '%s' "$lead_body" | grep -q '"stage-stub"'; then
            echo "ок: форма на stage отвечает заглушкой, не боевым обработчиком"
          else
            echo "::error::api/leads на stage не похож на заглушку: $lead_body"
            fail=1
          fi
          if [ "$fail" = 1 ]; then
            echo "::error::stage отвечает не так, как должен."
            exit 1
          fi
