name: Убрать превью удалённой ветки

# Ветку слили в main и удалили — значит её превью больше не нужно.
# Без этого папка preview/ обрастает мёртвыми копиями сайта.
on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: "Имя ветки, превью которой удалить"
        required: true

jobs:
  cleanup:
    # Событие delete срабатывает и на удаление тега — теги нас не касаются.
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Удалить папку превью
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          raw="${{ github.event.inputs.branch || github.event.ref }}"
          slug=$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-40)

          # main сюда попасть не может, но если чья-то ошибка приведёт —
          # пусть лучше упадёт, чем снесёт боевой сайт.
          if [ -z "$slug" ] || [ "$slug" = "main" ] || [ "$slug" = "." ] || [ "$slug" = ".." ]; then
            echo "Отказ: недопустимое имя папки '$slug'"
            exit 1
          fi

          echo "Удаляю превью ветки '$raw' → papka '$slug'"

          # lftp умеет рекурсивное удаление, curl — нет.
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<LFTP
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:timeout 20
          cd httpdocs/preview
          glob -d rm -rf "$slug" || echo "Папки нет — уже удалена"
          bye
          LFTP

          echo "Готово: https://trexgo.ru/preview/$slug/ больше не существует"
