name: Превью ветки

# Заливает ветку в отдельную папку на том же хостинге, чтобы показать правки
# до выкладки на боевой сайт. Адрес: https://trexgo.ru/preview/<имя-ветки>/
#
# Боевой сайт при этом не трогается: выкладка ведёт список своих файлов и
# посторонние папки не удаляет (проверено, см. config-snapshots/mchost.md).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# Два прогона одной ветки затопчут друг друга. Ждём предыдущий.
concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Имя ветки идёт в путь на сервере. Косые черты (site/fix-menu) сломали бы
      # вложенность, всё нестандартное — заменяем на дефис.
      - name: Собрать имя папки из имени ветки
        id: slug
        run: |
          slug=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-40)
          echo "value=$slug" >> "$GITHUB_OUTPUT"
          echo "Папка превью: $slug"

      # Превью не должно попасть в поиск ни при каких обстоятельствах.
      # Заголовок X-Robots-Tag надёжнее мета-тега: действует и на картинки,
      # и на PDF, и когда робот пришёл по прямой ссылке из переписки.
      #
      # Свой robots.txt здесь класть бесполезно — поисковики читают его только
      # в корне домена. Запрет на /preview/ прописан в robots.txt боевого сайта.
      - name: Закрыть превью от поисковиков
        run: |
          cat > .htaccess <<'HTACCESS'
          # Служебная папка превью. Файл генерируется автоматически
          # в .github/workflows/preview.yml — правки здесь потеряются.

          <IfModule mod_headers.c>
            Header set X-Robots-Tag "noindex, nofollow, noarchive"
          </IfModule>

          Options -Indexes
          AddDefaultCharset UTF-8

          # Правила mod_rewrite из корневого .htaccess сюда НЕ наследуются —
          # редирект на HTTPS приходится повторять, иначе превью откроется по http.
          RewriteEngine On
          RewriteCond %{HTTPS} !=on
          RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

          RewriteRule ^\.ftp-deploy-preview-state\.json$ - [F,L]
          RewriteRule (^|/)\.(?!well-known/) - [F,L]
          HTACCESS

          # Файла robots.txt из репозитория в превью быть не должно: он относится
          # к боевому сайту и ссылается на его sitemap.
          rm -f robots.txt

      - name: Залить превью по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: httpdocs/preview/${{ steps.slug.outputs.value }}/
          # У каждой ветки свой файл состояния — иначе ветки затирали бы друг друга.
          state-name: .ftp-deploy-preview-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .claude/**
            CLAUDE.md
            README.md
            docs/**
            config-snapshots/**
            temp/**
            **/.DS_Store
            **/Thumbs.db

      - name: Показать ссылку
        run: |
          url="https://trexgo.ru/preview/${{ steps.slug.outputs.value }}/"
          echo "### Превью готово" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ветка \`${{ github.ref_name }}\`, коммит \`${GITHUB_SHA:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Закрыто от поисковиков. Удалится при слиянии ветки в main." >> "$GITHUB_STEP_SUMMARY"
